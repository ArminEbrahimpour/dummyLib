<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dummy Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #10141b;
      --header: #00001b;
      --card: #171c27;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --faint: rgba(255, 255, 255, 0.5);
      --line: rgba(255, 255, 255, 0.14);
      --violet: #5758ff;
      --violet-deep: #3d3eef;
      --gold: #e4c27a;
    }

    body {
      font-family: 'Outfit', Helvetica, sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.1rem;
      background: var(--header);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .menu-mark {
      width: 34px;
      height: 34px;
      display: grid;
      gap: 5px;
      align-content: center;
      justify-items: center;
      flex-shrink: 0;
    }
    .menu-mark span {
      display: block;
      width: 18px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    .wordmark {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-style: italic;
      font-size: 1.35rem;
      color: var(--gold);
      letter-spacing: 0.01em;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
    }

    .btn-open {
      font-family: inherit;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: var(--violet);
      border: 1px solid var(--violet);
      border-radius: 999px;
      padding: 0.55rem 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-open:hover { background: var(--violet-deep); }

    .rail {
      display: flex;
      gap: 0.55rem;
      overflow-x: auto;
      padding: 0.85rem 1rem 0.2rem;
      background: linear-gradient(180deg, var(--header), var(--bg) 90%);
    }
    .rail span {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.95rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.03);
    }

    .hero {
      position: relative;
      text-align: center;
      padding: 3.2rem 1.4rem 2.6rem;
      background:
        radial-gradient(ellipse 70% 80% at 50% 18%, rgba(120, 40, 190, 0.55), transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 8%, rgba(255, 80, 180, 0.18), transparent 70%),
        var(--bg);
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 1.5px);
      background-size: 120px 90px, 180px 140px;
      background-position: 20px 30px, 80px 70px;
      opacity: 0.35;
      pointer-events: none;
    }
    .hero > * { position: relative; }

    h1 {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      line-height: 1.25;
      max-width: 18ch;
      margin: 0 auto 0.9rem;
    }

    .lede {
      max-width: 38rem;
      margin: 0 auto 1.4rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-primary, .btn-summon, .empty-cta {
      font-family: inherit;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--violet);
      border: none;
      border-radius: 999px;
      padding: 0.9rem 1.6rem;
      font-size: 0.85rem;
      cursor: pointer;
      min-width: 220px;
    }
    .btn-primary:hover, .btn-summon:hover, .empty-cta:hover { background: var(--violet-deep); }

    .btn-ghost {
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      font-size: 0.82rem;
      cursor: pointer;
      min-width: 260px;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.06); }

    .section {
      padding: 0.5rem 1rem 3rem;
      max-width: 1040px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-weight: 400;
      font-size: 1.7rem;
      margin: 0.6rem 0 1rem;
    }

    #bookList {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 720px) {
      #bookList:not(:has(.empty)) { grid-template-columns: 1fr 1fr; }
    }

    .book {
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .cover {
      height: 150px;
      position: relative;
      background:
        radial-gradient(circle at 70% 20%, rgba(255,255,255,0.18), transparent 40%),
        linear-gradient(160deg, #3a1868, #1a1030 70%);
    }
    .book:nth-child(4n+2) .cover { background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.16), transparent 42%), linear-gradient(160deg, #12315e, #0d1528); }
    .book:nth-child(4n+3) .cover { background: radial-gradient(circle at 60% 30%, rgba(255,255,255,0.14), transparent 40%), linear-gradient(160deg, #4a1840, #1a1020); }
    .book:nth-child(4n+4) .cover { background: radial-gradient(circle at 40% 20%, rgba(255,255,255,0.14), transparent 40%), linear-gradient(160deg, #143c48, #101820); }

    .cover-mark {
      position: absolute;
      left: 1rem;
      bottom: 0.9rem;
      font-family: 'Libre Baskerville', serif;
      font-size: 1.8rem;
      color: rgba(255, 255, 255, 0.88);
    }

    .book-body { padding: 0.95rem 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.45rem; flex: 1; }

    .tag {
      align-self: flex-start;
      background: rgba(8, 10, 18, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 0.28rem 0.65rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: -1.7rem;
      position: relative;
    }

    .book-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1.15rem;
      font-weight: 400;
      line-height: 1.35;
    }

    .book-meta { color: var(--muted); font-size: 0.95rem; }

    .progress-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.15rem; }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--violet); border-radius: 99px; }
    .progress-label { font-size: 0.78rem; color: var(--faint); font-weight: 500; }

    .btn-resume {
      margin-top: auto;
      align-self: flex-start;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      padding: 0.5rem 0.95rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .btn-resume:hover { background: rgba(255, 255, 255, 0.08); }

    .empty {
      text-align: center;
      padding: 2.5rem 1.2rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
    }
    .empty p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin-bottom: 1rem; }

    .footer {
      text-align: center;
      color: var(--faint);
      font-size: 0.8rem;
      padding: 0 1rem 2rem;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 8, 0.72);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      width: min(520px, 100%);
      background: #141824;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 1.4rem 1.3rem 1.2rem;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    }

    .modal-header { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .modal-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 400;
    }
    .modal-sub { color: var(--muted); margin-top: 0.25rem; }
    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
    }

    .input-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 0.4rem;
    }

    .path-row {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #0d1118;
    }
    .path-row:focus-within { border-color: var(--violet); }
    .path-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.75rem 0.85rem;
      outline: none;
    }
    .path-input::placeholder { color: rgba(255,255,255,0.35); }
    .path-browse {
      border: none;
      border-left: 1px solid var(--line);
      background: transparent;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.72rem;
      padding: 0 0.9rem;
      cursor: pointer;
    }
    .path-browse:hover { background: rgba(255,255,255,0.06); }
    #realFileInput { display: none; }

    .divider-or {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0.9rem 0;
      color: var(--faint);
      font-size: 0.9rem;
    }
    .divider-or::before, .divider-or::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .drop-zone {
      position: relative;
      border: 1px dashed rgba(255,255,255,0.28);
      border-radius: 14px;
      text-align: center;
      padding: 1.3rem 0.8rem;
      cursor: pointer;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--violet); background: rgba(87, 88, 255, 0.08); }
    .drop-text { font-weight: 600; letter-spacing: 0.04em; }
    .drop-hint { color: var(--faint); margin-top: 0.2rem; font-size: 0.9rem; }

    .sel-pill {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
    }
    .sel-pill.visible { display: flex; }
    .sel-pill-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sel-pill-clear {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    .modal-status {
      display: none;
      margin-top: 0.8rem;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      gap: 0.4rem;
      align-items: center;
    }
    .modal-status.visible { display: flex; }
    .modal-status.success { background: rgba(46, 160, 90, 0.18); color: #b6f0c8; }
    .modal-status.error { background: rgba(180, 40, 60, 0.22); color: #ffc4cc; }
    .modal-status.loading { background: rgba(255,255,255,0.06); color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 1s linear infinite; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .btn-cancel {
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 999px;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .btn-summon { min-width: 0; padding: 0.7rem 1.1rem; }
    .btn-summon:disabled { opacity: 0.4; cursor: not-allowed; }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--violet);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="menu-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="wordmark">Dummy Library</div>
    </div>
    <button class="btn-open" id="openModalBtn" onclick="openModal()">Open a book</button>
  </header>

  <div class="rail" aria-hidden="true">
    <span>Your books</span>
    <span>In progress</span>
    <span>Recently opened</span>
    <span>Archive</span>
  </div>

  <section class="hero">
    <h1>Pick up where the last page left you</h1>
    <p class="lede" id="bookCount">Consulting the catalogue…</p>
    <div class="hero-actions">
      <button class="btn-primary" onclick="openModal()">Add a volume</button>
      <button class="btn-ghost" onclick="document.getElementById('shelf').scrollIntoView({behavior:'smooth'})">Browse the shelves</button>
    </div>
  </section>

  <main class="section" id="shelf">
    <h2 class="section-title">Your volumes</h2>
    <div id="bookList" role="list"></div>
  </main>

  <footer class="footer">Dummy Library</footer>

  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Add a volume">
      <div class="modal-header">
        <div>
          <div class="modal-title">Add a volume</div>
          <div class="modal-sub">Place a PDF on your shelves</div>
        </div>
        <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
      </div>

      <label class="input-label" for="pathInput">Full file path</label>
      <div class="path-row">
        <input
          class="path-input"
          id="pathInput"
          type="text"
          placeholder="/home/your/dummie/books/tome.pdf"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="path-browse" onclick="triggerFilePick()">Browse</button>
      </div>
      <input type="file" id="realFileInput" accept=".pdf" aria-label="Choose a PDF file">

      <div class="divider-or">or drop a file</div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="dropInput" accept=".pdf" aria-label="Choose a PDF file">
        <div class="drop-text">Click or drag a PDF here</div>
        <div class="drop-hint">PDF files only</div>
      </div>

      <div class="sel-pill" id="selPill">
        <span class="sel-pill-name" id="selPillName"></span>
        <button class="sel-pill-clear" onclick="clearFile()" aria-label="Clear">✕</button>
      </div>

      <div class="modal-status" id="modalStatus" role="status" aria-live="polite">
        <span id="statusIcon"></span>
        <span id="statusText"></span>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-summon" id="summonBtn" disabled onclick="summon()">
          <span>Add to the shelves</span>
        </button>
      </div>
    </div>
  </div>

<script>
  let pickedFile   = null;
  let manualPath   = '';
  let activePath   = '';

  function escHtml(t) {
    return String(t).replace(/[&<>"']/g, m =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('pathInput').focus();
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    clearFile();
    hideStatus();
  }
  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  function triggerFilePick() {
    document.getElementById('realFileInput').click();
  }
  document.getElementById('realFileInput').addEventListener('change', function() {
    if (this.files[0]) applyFile(this.files[0]);
  });
  document.getElementById('dropInput').addEventListener('change', function() {
    if (this.files[0]) applyFile(this.files[0]);
  });

  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) applyFile(f);
  });

  document.getElementById('pathInput').addEventListener('input', function() {
    manualPath = this.value.trim();
    if (manualPath) {
      activePath = manualPath;
      pickedFile = null;
      document.getElementById('selPill').classList.remove('visible');
      document.getElementById('summonBtn').disabled = false;
    } else {
      activePath = pickedFile ? (pickedFile.webkitRelativePath || pickedFile.name) : '';
      document.getElementById('summonBtn').disabled = !activePath;
    }
    hideStatus();
  });

  function applyFile(file) {
    pickedFile = file;
    const path = file.path || file.webkitRelativePath || file.name;
    activePath = path;
    document.getElementById('pathInput').value = path;
    manualPath = path;
    document.getElementById('selPillName').textContent = file.name;
    document.getElementById('selPill').classList.add('visible');
    document.getElementById('summonBtn').disabled = false;
    hideStatus();
  }

  function clearFile() {
    pickedFile = null;
    manualPath = '';
    activePath = '';
    document.getElementById('pathInput').value = '';
    document.getElementById('realFileInput').value = '';
    document.getElementById('dropInput').value = '';
    document.getElementById('selPill').classList.remove('visible');
    document.getElementById('summonBtn').disabled = true;
    hideStatus();
  }

  function showStatus(type, icon, msg) {
    const box = document.getElementById('modalStatus');
    box.className = 'modal-status visible ' + type;
    document.getElementById('statusIcon').innerHTML = icon;
    document.getElementById('statusText').textContent = msg;
  }
  function hideStatus() {
    document.getElementById('modalStatus').className = 'modal-status';
  }

  async function summon() {
    const path = activePath || document.getElementById('pathInput').value.trim();
    if (!path) return;

    const btn = document.getElementById('summonBtn');
    btn.disabled = true;
    showStatus('loading', '<span class="spin">⟳</span>', 'Opening the volume…');

    try {
      const res = await fetch('/api/open?path=' + encodeURIComponent(path));
      if (res.redirected || res.ok) {
        showStatus('success', '✓', 'Added. Opening…');
        setTimeout(() => {
          window.location.href = res.url || '/';
        }, 800);
      } else {
        const msg = await res.text().catch(() => '');
        showStatus('error', '✕', msg || 'That path could not be found.');
        btn.disabled = false;
      }
    } catch (err) {
      showStatus('error', '✕', 'Cannot reach the server. Is it awake?');
      btn.disabled = false;
    }
  }

  document.getElementById('pathInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !document.getElementById('summonBtn').disabled) summon();
  });

  function renderBooks(books) {
    const listEl = document.getElementById('bookList');
    const countEl = document.getElementById('bookCount');

    if (!books || books.length === 0) {
      countEl.textContent = 'Your shelves are empty. Add a PDF and it will wait here for you.';
      listEl.innerHTML = `
        <div class="empty">
          <p>No volumes yet.</p>
          <button class="empty-cta" onclick="openModal()">Add a volume</button>
        </div>`;
      return;
    }

    countEl.textContent = books.length === 1
      ? 'One volume is waiting on the shelf.'
      : books.length + ' volumes are waiting on the shelf.';

    listEl.innerHTML = books.map((book) => {
      const pct = book.page_count ? Math.round((book.last_page / book.page_count) * 100) : 0;
      const dateStr = new Date(book.last_opened).toLocaleString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
      const label = book.page_count && pct >= 100 ? 'Finished' : 'In progress';
      return `
        <div class="book" role="listitem">
          <div class="cover" aria-hidden="true"><div class="cover-mark">✦</div></div>
          <div class="book-body">
            <div class="tag">${label}</div>
            <div class="book-title">${escHtml(book.title)}</div>
            <div class="book-meta">Page ${book.last_page} of ${book.page_count || '?'} · ${dateStr}</div>
            ${book.page_count ? `
            <div class="progress-row">
              <div class="progress-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Reading progress">
                <div class="progress-fill" style="width:${pct}%"></div>
              </div>
              <span class="progress-label">${pct}%</span>
            </div>` : ''}
            <a class="btn-resume" href="/view.html?book=${escHtml(book.id)}">Continue</a>
          </div>
        </div>`;
    }).join('');
  }

  async function loadBooks() {
    try {
      const res = await fetch('/api/books');
      if (!res.ok) throw new Error('non-ok');
      const books = await res.json();
      renderBooks(Array.isArray(books) ? books : []);
    } catch {
      renderBooks([]);
    }
  }

  loadBooks();
</script>
</body>
</html>
