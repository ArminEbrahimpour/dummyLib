<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening volume…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Outfit:wght@300;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Outfit', Helvetica, sans-serif;
      font-weight: 300;
      color: #fff;
      background:
        radial-gradient(ellipse 70% 60% at 50% 30%, rgba(120, 40, 190, 0.55), transparent 62%),
        radial-gradient(ellipse 40% 35% at 50% 12%, rgba(255, 80, 180, 0.16), transparent 70%),
        #10141b;
      text-align: center;
      padding: 1.5rem;
    }

    .panel { max-width: 34rem; }

    .wordmark {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-style: italic;
      color: #e4c27a;
      margin-bottom: 1.4rem;
      font-size: 1.15rem;
    }

    .title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      line-height: 1.3;
    }

    .sub {
      margin-top: 0.8rem;
      color: rgba(255, 255, 255, 0.72);
      font-size: 1.05rem;
    }

    .dots {
      margin-top: 1.6rem;
      display: flex;
      justify-content: center;
      gap: 0.45rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5758ff;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    .error-box {
      display: none;
      margin: 1.2rem auto 0;
      max-width: 24rem;
      background: rgba(180, 40, 60, 0.22);
      color: #ffc4cc;
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
    }
    .error-box.visible { display: block; }

    .back-link {
      display: inline-block;
      margin-top: 1.8rem;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      padding: 0.75rem 1.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }
    .back-link:hover { background: rgba(255, 255, 255, 0.06); }
    .back-link:focus-visible { outline: 2px solid #5758ff; outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="wordmark">Dummy Library</div>
    <div class="title" id="titleEl">Opening the volume…</div>
    <div class="sub" id="subEl">Finding your place</div>
    <div class="dots" aria-hidden="true">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="error-box" id="errorBox" role="alert"></div>
    <a class="back-link" href="/">Back to the library</a>
  </div>

  <script>
    async function init() {
      const params  = new URLSearchParams(window.location.search);
      const bookId  = params.get('book');
      const titleEl = document.getElementById('titleEl');
      const subEl   = document.getElementById('subEl');
      const errBox  = document.getElementById('errorBox');

      if (!bookId) {
        titleEl.textContent = 'Missing volume';
        subEl.textContent   = 'No book was specified.';
        errBox.textContent  = 'No ?book= parameter found in the URL.';
        errBox.classList.add('visible');
        return;
      }

      let lastPage = 1;
      try {
        const resp = await fetch('/api/books/' + bookId);
        if (resp.ok) {
          const book = await resp.json();
          lastPage = book.last_page || 1;
          if (book.title) {
            titleEl.textContent = book.title;
            subEl.textContent   = 'Resuming at page ' + lastPage;
          }
        }
      } catch (e) {
        console.error('Could not fetch book metadata', e);
      }

      const viewerURL =
        '/viewer/web/viewer.html'
        + '?file=' + encodeURIComponent('/api/books/' + bookId + '/pdf')
        + '&bookId=' + bookId
        + '#page=' + lastPage;

      setTimeout(() => {
        window.location.replace(viewerURL);
      }, 700);
    }

    init();
  </script>
</body>
</html>
